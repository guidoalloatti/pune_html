<div id="online-setup" class="setup-screen">
  <div id="online-setup-backdrop" class="online-setup-backdrop"></div>
  <div id="online-lobby">
    <div class="online-hero">
      <div class="online-hero-image"><img src="./static/images/pune2.png" alt="Pune worms" /></div>
      <div class="online-hero-text">
        <div class="online-title">Play Online</div>
        <div class="online-subtitle">Create or join a match in seconds</div>
      </div>
      <div class="online-hero-controls">
        <div class="online-hero-controls-title">Default Controls</div>
        <div class="online-row">
          <button id="mobile-left" type="button">◀ Left</button>
          <button id="mobile-right" type="button">Right ▶</button>
        </div>
        <div id="touch-hint" class="touch-hint">Touch and hold the buttons to steer.</div>
      </div>
    </div>
    <div class="online-grid">
      <div class="online-actions">
        <div class="online-actions-grid">
          <div class="online-action-group online-action-group-all">
            <div class="online-action-title">Game</div>
            <div class="online-row room-create-row">
              <button id="create-room-btn" class="room-action-btn room-create-btn" type="button">➕ Create Game</button>
            </div>
            <div class="online-row room-code-row">
              <input id="room-code" type="text" placeholder="ROOM CODE" maxlength="5" />
              <button id="join-room-btn" class="room-action-btn" type="button">Join Game</button>
            </div>
            <div class="online-row room-actions-row">
              <button id="copy-room-btn" class="room-action-btn" type="button">📋 Copy</button>
              <button id="paste-room-btn" class="room-action-btn" type="button">📥 Paste & Join</button>
            </div>
            <br>
            <div class="online-row">
              <button id="start-online-btn" class="start-host-btn" type="button" style="display: none;">🚀 Start Game</button>
            </div>
            <div class="online-action-divider"></div>
            <div class="online-action-title">Game Settings</div>
            <div class="online-row">
              <label for="online_hole_points">Hole Points</label>
              <select id="online_hole_points">
                <option selected>None</option>
                <option>One</option>
              </select>
            </div>
            <div class="online-row">
              <label for="online_speed">Speed</label>
              <select id="online_speed">
                <option>Slow</option>
                <option>Normal</option>
                <option selected>Frantic</option>
              </select>
            </div>
            <div class="online-row">
              <label for="online_gap_spacing">Gap Spacing</label>
              <select id="online_gap_spacing">
                <option>Close</option>
                <option>Normal</option>
                <option selected>Far Apart</option>
              </select>
            </div>
            <div class="online-row">
              <label for="online_gap_sizing">Gap Size</label>
              <select id="online_gap_sizing">
                <option>Small</option>
                <option>Normal</option>
                <option selected>Large</option>
              </select>
            </div>
            <div class="online-row room-actions-row">
              <button id="online-settings-reset" class="room-action-btn" type="button">Reset Defaults</button>
              <button id="online-settings-save" class="room-action-btn" type="button">Save Settings</button>
            </div>
            <div class="online-action-divider"></div>
            <div class="online-action-title">Players & Chat</div>
            <div class="online-subsection">
              <div class="online-row profile-row">
                <div class="profile-input">
                  <input id="profile-name" type="text" maxlength="16" placeholder="Player" />
                  <input id="profile-color" type="color" value="#6de38c" />
                </div>
              </div>
              <div id="online-players"></div>
              <div id="online-chat-log"></div>
              <div class="online-row">
                <input id="online-chat-input" type="text" placeholder="Type a message" />
                <button id="online-chat-send" type="button">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="online-footer">
      <div id="online-status">Disconnected</div>
      <div>Room: <span id="online-room">-</span></div>
      <div id="reconnect-banner" class="reconnect-banner" style="display: none;">Reconnected</div>
    </div>
  </div>
</div>

<div id="sounds-menu" class="modal-shell" style="display: none;">
  <div class="modal-card sounds-card">
    <div class="modal-header">
      <div class="modal-title">Sounds</div>
      <button type="button" class="close-panel-btn modal-close" id="sounds-close-btn" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="sounds-controls">
        <div class="sounds-row">
          <label for="sounds-volume">SFX</label>
          <input id="sounds-volume" type="range" min="0" max="100" step="1" value="25" />
          <span id="sounds-volume-value">25%</span>
        </div>
        <div class="sounds-row">
          <label for="music-volume">Music</label>
          <input id="music-volume" type="range" min="0" max="100" step="1" value="20" />
          <span id="music-volume-value">20%</span>
        </div>
        <div class="sounds-row">
          <label for="music-track">Track</label>
          <select id="music-track">
            <option value="synthwave">Synthwave Drive</option>
            <option value="outrun">Neon Outrun</option>
            <option value="arcade">Arcade Rush</option>
            <option value="noir">Noir Midnight</option>
            <option value="pulse">Crystal Pulse</option>
            <option value="midnight">Midnight Echoes</option>
            <option value="drift">Slow Drift</option>
            <option value="signal">Signal Glow</option>
            <option value="haze">Velvet Haze</option>
            <option value="aurora">Aurora Calm</option>
          </select>
        </div>
        <div class="sounds-row">
          <span class="sounds-toggle-label">Music</span>
          <button id="toggle-synth" type="button" class="sounds-toggle-btn" aria-pressed="false">Off</button>
        </div>
      </div>
      <div class="sounds-section">
        <div class="sounds-title">Worms Winning Shouts</div>
        <div class="sounds-grid">
          <button type="button" class="sound-item" id="play-red-winning-shout">
            <span id="red-image" class="sound-dot"></span>
            <span class="sound-label">Red</span>
          </button>
          <button type="button" class="sound-item" id="play-blue-winning-shout">
            <span id="blue-image" class="sound-dot"></span>
            <span class="sound-label">Blue</span>
          </button>
          <button type="button" class="sound-item" id="play-green-winning-shout">
            <span id="green-image" class="sound-dot"></span>
            <span class="sound-label">Green</span>
          </button>
          <button type="button" class="sound-item" id="play-purple-winning-shout">
            <span id="purple-image" class="sound-dot"></span>
            <span class="sound-label">Purple</span>
          </button>
          <button type="button" class="sound-item" id="play-yellow-winning-shout">
            <span id="yellow-image" class="sound-dot"></span>
            <span class="sound-label">Yellow</span>
          </button>
          <button type="button" class="sound-item" id="play-cyan-winning-shout">
            <span id="cyan-image" class="sound-dot"></span>
            <span class="sound-label">Cyan</span>
          </button>
        </div>
      </div>

      <div class="sounds-section">
        <div class="sounds-title">Game Funny Sounds</div>
        <div class="sounds-grid">
          <button type="button" class="sound-item" id="play-die-shout">
            <span id="die-image" class="sound-dot"></span>
            <span class="sound-label">Die</span>
          </button>
          <button type="button" class="sound-item" id="play-yabass-shout">
            <span id="yabass-image" class="sound-dot"></span>
            <span class="sound-label">Yabass</span>
          </button>
          <button type="button" class="sound-item" id="play-speeding-shout">
            <span id="speeding-image" class="sound-dot"></span>
            <span class="sound-label">Speed</span>
          </button>
          <button type="button" class="sound-item" id="play-winning-shout">
            <span id="winning-image" class="sound-dot"></span>
            <span class="sound-label">Win</span>
          </button>
          <button type="button" class="sound-item" id="play-pause-shout">
            <span id="pause-image" class="sound-dot"></span>
            <span class="sound-label">Pause</span>
          </button>
          <button type="button" class="sound-item" id="play-burp-shout">
            <span id="burp-image" class="sound-dot"></span>
            <span class="sound-label">Burp</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
